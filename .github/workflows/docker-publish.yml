name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: skonamonkey

jobs:
  # amd64 is built natively by the runner and is what almost every user pulls,
  # so it goes first and goes fast. It is published as a single-arch image under
  # the real tags, which means :latest is usable within a couple of minutes of a
  # merge rather than waiting on an emulated compile.
  build-amd64:
    name: Build (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            context: ./api
          - component: dashboard
            context: ./dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/skonadesk-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push amd64
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-amd64

  # arm64 runs under QEMU and is an order of magnitude slower, so it gets its own
  # job that appends to the manifest afterwards. It does not hold up amd64, and a
  # slow or failed arm64 leg cannot leave the project without a usable image.
  build-arm64:
    name: Build (arm64, emulated)
    needs: build-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            context: ./api
          - component: dashboard
            context: ./dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/skonadesk-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build the arm64 image and push it by digest only. Pushing under a tag here
      # would overwrite the amd64 image that the previous job just published, so
      # push-by-digest keeps the tag untouched while still uploading the layers.
      #
      # NB: `tags` must remain set even though we are pushing by digest — buildx
      # rejects the build outright with "tag is needed when pushing to registry"
      # if no tag is supplied, because it still needs a name to register the image
      # under. push-by-digest is what stops that name being pointed at this build.
      - name: Build and push arm64 by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-arm64

      # Combine the already-published amd64 image with the arm64 digest into a
      # single multi-arch manifest, so `docker pull` resolves per-platform as before.
      - name: Append arm64 to the multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/skonadesk-${{ matrix.component }}
          ARM64_DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=""
          for tag in $TAGS; do
            tag_args="$tag_args --tag $tag"
          done
          docker buildx imagetools create $tag_args \
            "${IMAGE}@${ARM64_DIGEST}"
          echo "Appended arm64 digest ${ARM64_DIGEST} to:"
          echo "$TAGS"

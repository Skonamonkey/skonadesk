name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: skonamonkey

jobs:
  # Single multi-arch build per image, exactly as before. amd64 and arm64 are built
  # in one buildx invocation so the published manifest is correct by construction.
  #
  # This is deliberately NOT split into separate amd64/arm64 jobs. An amd64-first
  # split was tried in #11/#12 to avoid waiting on the emulated arm64 leg, but
  # assembling the multi-arch manifest across jobs does not work cleanly: buildx
  # rejects `--tag` together with push-by-digest, and provenance attestations add
  # an unknown/unknown manifest entry that cannot be amended by `imagetools create`
  # from a later job. Revisit with a proper test harness, not on main.
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            context: ./api
          - component: dashboard
            context: ./dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/skonadesk-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
